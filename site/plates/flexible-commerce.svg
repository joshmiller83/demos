<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400">
  <!-- Flexible Drupal Commerce: a merchant's rules in, a store that follows them out.
       A checklist feeds a machine (blue) whose window shows a category tree, with a
       gear and two coins that overprint where one currency becomes another. A boxed,
       price-tagged product flies into one of two carts outside the shop (green). -->
  <style>
    :root { --stock: #e2e7ed; --a: #3fa35b; --b: #2f6bc4; --k: #1d2340; }
    .stock { fill: var(--stock); }
    .pass { mix-blend-mode: multiply; }
    .a { fill: var(--a); }
    .b { fill: var(--b); }
    .kf { fill: var(--k); }
    .x { fill: #fff; }
    .ta { fill: url(#ta); }
    .tb { fill: url(#tb); }
    .tk { fill: url(#tk); }
    .k, .k2, .dot { fill: none; stroke: var(--k); stroke-linecap: round; stroke-linejoin: round; }
    .k { stroke-width: 3; }
    .k2 { stroke-width: 2; }
    .dot { stroke-width: 2.4; stroke-dasharray: 0.1 7; }
    .kx, .kx2 { fill: #fff; stroke: var(--k); stroke-linejoin: round; }
    .kx { stroke-width: 3; }
    .kx2 { stroke-width: 2; }
  </style>
  <defs>
    <pattern id="tk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" style="fill: var(--k)" />
    </pattern>
    <pattern id="ta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="3" cy="3" r="1.7" style="fill: var(--a)" />
    </pattern>
    <pattern id="tb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(75)">
      <circle cx="3" cy="3" r="1.7" style="fill: var(--b)" />
    </pattern>
    <clipPath id="awning-clip">
      <path d="M406 142 H564 V164 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 Z" />
    </clipPath>

    <!-- the merchant's checklist -->
    <path id="sheet" d="M48 96 H118 L134 112 V262 H48 Z" />
    <rect id="box" x="58" width="14" height="14" rx="2" />
    <rect id="slip" width="24" height="16" rx="2" />

    <!-- the machine -->
    <path id="hopper" d="M184 108 H252 L236 150 H200 Z" />
    <rect id="body" x="166" y="150" width="172" height="180" rx="10" />
    <rect id="win" x="180" y="166" width="94" height="88" rx="4" />
    <path id="gear" d="M302.0 185.4 L303.1 178.2 L308.9 178.2 L310.0 185.4 L314.9 187.0 L320.0 181.8 L324.7 185.2 L321.4 191.7 L324.4 195.8 L331.6 194.6 L333.4 200.2 L326.8 203.4 L326.8 208.6 L333.4 211.8 L331.6 217.4 L324.4 216.2 L321.4 220.3 L324.7 226.8 L320.0 230.2 L314.9 225.0 L310.0 226.6 L308.9 233.8 L303.1 233.8 L302.0 226.6 L297.1 225.0 L292.0 230.2 L287.3 226.8 L290.6 220.3 L287.6 216.2 L280.4 217.4 L278.6 211.8 L285.2 208.6 L285.2 203.4 L278.6 200.2 L280.4 194.6 L287.6 195.8 L290.6 191.7 L287.3 185.2 L292.0 181.8 L297.1 187.0 Z" />
    <circle id="coin-a" cx="204" cy="292" r="16" />
    <circle id="coin-b" cx="228" cy="292" r="16" />
    <rect id="spout" x="338" y="278" width="22" height="20" rx="2" />
    <rect id="parcel" x="-9" y="-8" width="18" height="16" rx="2" />
    <path id="tag" d="M0 4 L5 0 L14 0 V8 H5 Z" />

    <!-- the shop -->
    <rect id="wall" x="414" y="170" width="142" height="160" />
    <path id="awning" d="M406 142 H564 V164 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 a9.875 9.875 0 0 1 -19.75 0 Z" />
    <rect id="sign" x="440" y="112" width="90" height="24" rx="3" />
    <rect id="window" x="426" y="190" width="62" height="64" rx="3" />
    <rect id="door" x="502" y="220" width="40" height="110" rx="3" />
    <rect id="door-glass" x="510" y="230" width="24" height="30" rx="2" />
    <path id="key-tag" d="M0 5 L6 0 L12 5 V22 H0 Z" />
    <path id="basket" d="M0 0 H40 L35 22 H5 Z" />
  </defs>

  <rect class="stock" width="600" height="400" />

  <!-- shadows -->
  <g class="pass">
    <ellipse class="tk" cx="252" cy="335" rx="98" ry="8" />
    <ellipse class="tk" cx="484" cy="335" rx="80" ry="8" />
  </g>

  <!-- pass A: green, what shoppers get -->
  <g class="pass" transform="translate(3 2)">
    <g transform="rotate(-6 91 179)">
      <use href="#box" xlink:href="#box" y="137" class="a" />
      <use href="#box" xlink:href="#box" y="161" class="a" />
      <use href="#box" xlink:href="#box" y="185" class="a" />
      <use href="#box" xlink:href="#box" y="209" class="a" />
    </g>
    <g transform="translate(158 108) rotate(-24)"><use href="#slip" xlink:href="#slip" class="a" /></g>

    <circle class="a" cx="204" cy="206" r="5" />
    <circle class="a" cx="193" cy="236" r="4.5" />
    <circle class="a" cx="237" cy="236" r="4.5" />
    <use href="#gear" xlink:href="#gear" class="a" />
    <use href="#coin-a" xlink:href="#coin-a" class="a" />
    <g transform="translate(398 262) rotate(14)"><use href="#tag" xlink:href="#tag" x="8" y="2" class="a" /></g>

    <use href="#wall" xlink:href="#wall" class="ta" />
    <use href="#window" xlink:href="#window" class="x" />
    <use href="#door" xlink:href="#door" class="x" />
    <g clip-path="url(#awning-clip)">
      <rect class="a" x="406" y="140" width="19.75" height="36" />
      <rect class="a" x="445.5" y="140" width="19.75" height="36" />
      <rect class="a" x="485" y="140" width="19.75" height="36" />
      <rect class="a" x="524.5" y="140" width="19.75" height="36" />
    </g>
    <rect class="a" x="434" y="224" width="14" height="14" rx="1" />
    <rect class="a" x="466" y="228" width="12" height="10" rx="1" />
    <g transform="translate(528 284) rotate(-12)"><use href="#key-tag" xlink:href="#key-tag" class="a" /></g>
    <g transform="translate(418 292)"><use href="#basket" xlink:href="#basket" class="a" /></g>
    <g transform="translate(476 292)"><rect class="a" x="20" y="-9" width="12" height="11" rx="1" /></g>
  </g>

  <!-- pass B: blue, what the site builder sets up -->
  <g class="pass" transform="translate(-2 3)">
    <g transform="rotate(-6 91 179)">
      <rect class="tb" x="78" y="185" width="44" height="14" rx="2" />
    </g>

    <use href="#body" xlink:href="#body" class="tb" />
    <use href="#win" xlink:href="#win" class="x" />
    <use href="#gear" xlink:href="#gear" class="x" />
    <use href="#coin-a" xlink:href="#coin-a" class="x" />
    <use href="#coin-b" xlink:href="#coin-b" class="b" />
    <circle class="b" cx="248" cy="206" r="5" />
    <circle class="b" cx="215" cy="236" r="4.5" />
    <circle class="b" cx="259" cy="236" r="4.5" />
    <g transform="translate(398 262) rotate(14)"><use href="#parcel" xlink:href="#parcel" class="b" /></g>

    <use href="#sign" xlink:href="#sign" class="b" />
    <rect class="x" x="452" y="120" width="44" height="8" rx="2" />
    <rect class="x" x="504" y="120" width="14" height="8" rx="2" />
    <use href="#door" xlink:href="#door" class="b" />
    <use href="#door-glass" xlink:href="#door-glass" class="x" />
    <rect class="b" x="450" y="226" width="12" height="12" rx="1" />
    <g transform="translate(418 292)"><rect class="b" x="7" y="-10" width="14" height="12" rx="1" /></g>
    <g transform="translate(476 292)"><use href="#basket" xlink:href="#basket" class="b" /></g>
  </g>

  <!-- key -->
  <g class="pass">
    <!-- the checklist: four rules checked, one still open -->
    <g transform="rotate(-6 91 179)">
      <use href="#sheet" xlink:href="#sheet" class="kx" />
      <path class="k2" d="M118 96 V112 H134" />
      <path class="k" d="M58 120 H100" />
      <use href="#box" xlink:href="#box" y="137" class="k2" />
      <use href="#box" xlink:href="#box" y="161" class="k2" />
      <use href="#box" xlink:href="#box" y="185" class="k2" />
      <use href="#box" xlink:href="#box" y="209" class="k2" />
      <use href="#box" xlink:href="#box" y="233" class="k2" />
      <path class="k2" d="M61 144 l3.5 3.5 l7 -8 M61 168 l3.5 3.5 l7 -8 M61 192 l3.5 3.5 l7 -8 M61 216 l3.5 3.5 l7 -8" />
      <path class="k2" d="M80 144 H124 M80 168 H112 M80 192 H120 M80 216 H106 M80 240 H116" />
    </g>

    <!-- a rule on its way into the hopper -->
    <path class="dot" d="M140 168 C152 140 162 112 186 100 C200 93 212 96 220 104" />
    <g transform="translate(158 108) rotate(-24)">
      <use href="#slip" xlink:href="#slip" class="kx2" />
      <path class="k2" d="M6 8 l3 3 l6 -7" />
    </g>

    <!-- the machine: hopper, category tree, gear, coins, spout -->
    <use href="#hopper" xlink:href="#hopper" class="tk" />
    <use href="#hopper" xlink:href="#hopper" class="k" />
    <path class="k" d="M192 118 H244" />
    <use href="#body" xlink:href="#body" class="k" />
    <use href="#win" xlink:href="#win" class="kx2" />
    <path class="k2" d="M226 187 V196 H204 V201 M226 196 H248 V201 M204 211 V224 H193 V231.5 M204 224 H215 V231.5 M248 211 V224 H237 V231.5 M248 224 H259 V231.5" />
    <circle class="kf" cx="226" cy="182" r="5" />
    <circle class="kx2" cx="204" cy="206" r="5" />
    <circle class="kx2" cx="248" cy="206" r="5" />
    <circle class="kx2" cx="193" cy="236" r="4.5" />
    <circle class="kx2" cx="215" cy="236" r="4.5" />
    <circle class="kx2" cx="237" cy="236" r="4.5" />
    <circle class="kx2" cx="259" cy="236" r="4.5" />
    <use href="#gear" xlink:href="#gear" class="k2" />
    <circle class="kx2" cx="306" cy="206" r="7" />
    <circle class="k2" cx="204" cy="292" r="16" />
    <circle class="k2" cx="228" cy="292" r="16" />
    <circle class="k2" cx="204" cy="292" r="10" />
    <circle class="k2" cx="228" cy="292" r="10" />
    <path class="k2" d="M270 272 H322 M270 286 H310 M270 300 H318" />
    <circle class="kf" cx="178" cy="162" r="2.4" />
    <circle class="kf" cx="326" cy="162" r="2.4" />
    <circle class="kf" cx="178" cy="318" r="2.4" />
    <circle class="kf" cx="326" cy="318" r="2.4" />
    <use href="#spout" xlink:href="#spout" class="tk" />
    <use href="#spout" xlink:href="#spout" class="k" />

    <!-- a boxed, price-tagged product on its way to a cart -->
    <path class="dot" d="M366 282 C380 254 410 248 428 268 C433 274 436 280 437 286" />
    <g transform="translate(398 262) rotate(14)">
      <use href="#parcel" xlink:href="#parcel" class="kx2" />
      <path class="k2" d="M-9 -2 H9 M0 -8 V-2" />
      <path class="k2" d="M9 6 L12 5" />
      <use href="#tag" xlink:href="#tag" x="8" y="2" class="kx2" />
      <circle class="kf" cx="13" cy="6" r="1.2" />
    </g>

    <!-- the shop -->
    <use href="#wall" xlink:href="#wall" class="k" />
    <path class="k2" d="M452 136 V142 M518 136 V142" />
    <use href="#sign" xlink:href="#sign" class="k" />
    <use href="#awning" xlink:href="#awning" class="k" />
    <use href="#window" xlink:href="#window" class="kx2" />
    <path class="k2" d="M426 238 H488" />
    <rect class="k2" x="434" y="224" width="14" height="14" rx="1" />
    <rect class="k2" x="450" y="226" width="12" height="12" rx="1" />
    <rect class="k2" x="466" y="228" width="12" height="10" rx="1" />
    <use href="#door" xlink:href="#door" class="k" />
    <use href="#door-glass" xlink:href="#door-glass" class="kx2" />
    <circle class="kf" cx="534" cy="281" r="3" />

    <!-- a members-only tag on the door handle -->
    <path class="k2" d="M534 281 L535 286" />
    <g transform="translate(528 284) rotate(-12)">
      <use href="#key-tag" xlink:href="#key-tag" class="kx2" />
      <circle class="kx2" cx="6" cy="5" r="1.8" />
      <path class="k2" d="M3.5 12 l2 2 l3.5 -4" />
    </g>

    <!-- two carts out front, one per store -->
    <g transform="translate(418 292)">
      <rect class="kx2" x="7" y="-10" width="14" height="12" rx="1" />
      <use href="#basket" xlink:href="#basket" class="kx" />
      <path class="k2" d="M10 0 L12 22 M20 0 V22 M30 0 L28 22" />
      <path class="k" d="M-10 -8 H-4 L0 0 M5 22 L3 30 H37" />
      <circle class="kx2" cx="8" cy="34" r="4" />
      <circle class="kx2" cx="32" cy="34" r="4" />
    </g>
    <g transform="translate(476 292)">
      <rect class="kx2" x="20" y="-9" width="12" height="11" rx="1" />
      <use href="#basket" xlink:href="#basket" class="kx" />
      <path class="k2" d="M10 0 L12 22 M20 0 V22 M30 0 L28 22" />
      <path class="k" d="M-10 -8 H-4 L0 0 M5 22 L3 30 H37" />
      <circle class="kx2" cx="8" cy="34" r="4" />
      <circle class="kx2" cx="32" cy="34" r="4" />
    </g>
  </g>
</svg>
